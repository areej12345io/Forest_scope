services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-forestscope}
      POSTGRES_USER: ${DB_USER:-forestuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off job: creates the table and imports data/polygons.geojson
  loader:
    build: .
    command: python db/load_polygons.py
    environment: &dbenv
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-forestscope}
      DB_USER: ${DB_USER:-forestuser}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      <<: *dbenv
      EE_PROJECT: ${EE_PROJECT:?Set EE_PROJECT in .env}
      EE_SERVICE_ACCOUNT_KEY: /secrets/ee-key.json
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    volumes:
      - ./cache:/app/cache
      - ./secrets:/secrets:ro
    depends_on:
      loader:
        condition: service_completed_successfully

volumes:
  pgdata:
